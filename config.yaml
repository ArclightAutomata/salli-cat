# Global settings
download_dir: ./downloads

# Strip watermarks from downloaded PDFs (currently only ManualsLib)
strip_watermarks: true

# Browser to use: chromium, firefox, or webkit
browser: chromium

# Run browser in headless mode (no visible window)
# Note: Manual captcha solving requires headless: false
headless: false

# Run a headful browser on an Xvfb virtual display: it never appears on the
# desktop or steals focus, while sites (Cloudflare) still see a normal headful
# browser. Needs `apt install xvfb`. Manual captcha solving is impossible on a
# virtual display, so keep 2captcha configured.
virtual_display: true

# Stealth mode (playwright-stealth JS patches). Leave off: the browser is
# launched via patchright, which hides automation at the CDP level, and the
# stealth patches are themselves detected by Cloudflare's managed challenge
# (manualslib never gets past "Just a moment..." with them on).
stealth: false

# Use proxy for browser (requires PROXY_* vars in .env)
use_proxy: false

# Delay between requests in seconds
delay_min: 0
delay_max: 0

# Elektrotanya settings
elektrotanya:
  # Free-text search terms (each capped at 30 chars by the site). Defaults to
  # the manualslib brand list below if omitted.
  queries:
    - sony
    - panasonic
    - rca
    - jvc
    - toshiba
    - sharp
    - hitachi
    - zenith
  # Category filters (the site's `kategoria` select). tv + monitor cover CRTs.
  categories:
    - tv
    - monitor
  # The site allows 10 files/day per IP without an account. Without a proxy this
  # caps the run; with use_proxy it's how often the exit IP is rotated. The
  # limit is enforced on the file endpoint, so files go through the proxy too.
  daily_limit: 10
  use_proxy: true
  # Also index https://elektrotanya.com/show_servicemodes (~700 service-mode docs)
  servicemodes: true
  # Politeness (elektrotanya is a small community site — don't hammer it).
  delay_min: 3
  delay_max: 7

# ManualsLib settings
manualslib:
  brands:
    - rca
    - sharp
    - panasonic
    - sony
  # Categories to scrape for each brand (URL slug suffixes)
  # e.g. "tv" -> /brand/rca/tv.html
  categories:
    - tv
    - tv-dvd-combo
    - tv-vcr-combo
  # Override global settings for this scraper:
  use_proxy: true
  # browser: firefox
  # stealth: false
  # Must stay headful: manualslib sits behind a Cloudflare managed challenge
  # that headless browsers can never pass (patchright clears it automatically
  # in a visible window).
  headless: false

# ManualsBase settings
manualsbase:
  # Target categories (case-insensitive matching)
  # Any category containing these words will be scraped
  categories:
    - tv
    - television
    - monitor
    - crt
    - remote
  # Override global settings for this scraper:
  use_proxy: false
  headless: true

# Manualzz settings
manualzz:
  urls:
    - https://manualzz.com/catalog/computers+%26+electronics/TVs+%26+monitors/CRT+TVs
    - https://manualzz.com/catalog/computers+%26+electronics/TVs+%26+monitors/monitors+CRT
  # Override global settings for this scraper:
  # use_proxy: false
